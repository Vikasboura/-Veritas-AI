[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "C4", "PIE", "RET", "SIM"]
ignore = [
    "S101",  # assert in tests is fine
    "B008",  # FastAPI Depends() in defaults is the standard pattern
    "N818",  # Exception naming — allow AuthError etc
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
